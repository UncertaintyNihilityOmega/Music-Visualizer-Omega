<!DOCTYPE html>
<html lang="en" data-theme="omega">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Visualiser Omega</title>
<meta name="description" content="A music player and visualiser that plays the songs already on your device, listens to your microphone, and works offline.">
<meta name="theme-color" content="#0C0918">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<!-- iPhone and iPad: open from the Home Screen as an app, with a dark status bar -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Visualiser Ω">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/styles.css">
<script>
/* Before anything is drawn: put back the colours of the saved theme code, so the page does not show the
   default purple for a moment first. themes.js keeps a copy of the current theme's colours in
   localStorage "viz.themeVars" (CSS variable name -> value). */
(function(){
  try {
    var id = localStorage.getItem('viz.theme'), vars = JSON.parse(localStorage.getItem('viz.themeVars') || 'null');
    if (!id || !vars) return;
    var root = document.documentElement;
    root.setAttribute('data-theme', id);
    for (var k in vars) if (/^--[a-z0-9-]+$/.test(k)) root.style.setProperty(k, String(vars[k]));
  } catch (e) {}
})();
</script>
</head>
<body>
<div class="app">
  <!-- The stage: always on screen, whatever page is open below it -->
  <h1 class="title" id="appTitle">Music Visualiser <span>Ω</span></h1>

  <div class="card viz-card" id="vizCard">
    <button class="viz-fs" id="fsBtn" type="button" aria-label="Fullscreen visualiser" title="Fullscreen (F)">⛶</button>
    <canvas id="visualizer"></canvas>
    <!-- In fullscreen this bar lies over the lower edge of the picture and fades out when nothing is touched -->
    <div class="fs-bar" id="fsBar">
    <div class="modes-wrap">
    <!-- Left of the line: modes that change with the theme codes. Right of it: modes that do not. -->
    <div class="mode-row" role="tablist" aria-label="Visualiser style">
      <button class="mode-btn active" type="button" data-mode="basic" role="tab" aria-selected="true">Basic</button>
      <button class="mode-btn" type="button" data-mode="strings" role="tab" aria-selected="false">String</button>
      <button class="mode-btn" type="button" data-mode="emoji" role="tab" aria-selected="false">Emoji</button>
      <button class="mode-btn" type="button" data-mode="fire" role="tab" aria-selected="false">Fire</button>
      <button class="mode-btn" type="button" data-mode="rain" role="tab" aria-selected="false">Rain</button>
      <button class="mode-btn" type="button" data-mode="nature" role="tab" aria-selected="false">Nature</button>
      <button class="mode-btn" type="button" data-mode="clock" role="tab" aria-selected="false">Clock</button>
      <button class="mode-btn" type="button" data-mode="liquid" role="tab" aria-selected="false">Liquid</button>
      <span class="mode-sep" aria-hidden="true"></span>
      <button class="mode-btn" type="button" data-mode="ice" role="tab" aria-selected="false">Ice</button>
      <button class="mode-btn" type="button" data-mode="aqua" role="tab" aria-selected="false">Aquatic</button>
      <button class="mode-btn" type="button" data-mode="piano" role="tab" aria-selected="false">Piano</button>
    </div>
    <!-- Left of the line: the two games that will grow (v1.x, v2.x). Right of it: the mini-games. -->
    <div class="mode-row game-row" role="tablist" aria-label="Games">
      <span class="mode-sep fs-only" aria-hidden="true"></span>
      <button class="mode-btn" type="button" data-mode="rpg" role="tab" aria-selected="false">Undarum</button>
      <button class="mode-btn" type="button" data-mode="td" role="tab" aria-selected="false">Artificium</button>
      <span class="mode-sep" aria-hidden="true"></span>
      <button class="mode-btn" type="button" data-mode="cards" role="tab" aria-selected="false">Dungeon of Echoes</button>
      <button class="mode-btn" type="button" data-mode="sandbox" role="tab" aria-selected="false">Solarium</button>
    </div>
    </div>
    <p class="now-playing" id="nowPlaying" aria-live="polite">Nothing loaded yet — add some music below</p>
    <p class="cors-note" id="corsNote"></p>
    </div>
  </div>

  <div class="card transport-card">
    <div class="transport">
      <button class="toggle" id="shuffleBtn" aria-label="Shuffle" title="Shuffle"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h3l10 12h4"/><path d="M3 18h3l3.2-3.8"/><path d="M12.8 9.8 16 6h4"/><path d="M18 3.5 20.5 6 18 8.5"/><path d="M18 15.5l2.5 2.5-2.5 2.5"/></svg></button>
      <button id="prevBtn" aria-label="Previous track" title="Previous">⏮</button>
      <button class="play-btn" id="playBtn" aria-label="Play">▶</button>
      <button id="nextBtn" aria-label="Next track" title="Next">⏭</button>
      <button class="toggle" id="repeatBtn" aria-label="Repeat" title="Repeat off"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12V9.5A3.5 3.5 0 0 1 7.5 6H19"/><path d="M16.5 3.5 19 6l-2.5 2.5"/><path d="M20 12v2.5a3.5 3.5 0 0 1-3.5 3.5H5"/><path d="M7.5 20.5 5 18l2.5-2.5"/><text class="one-mark" x="12" y="14.9" text-anchor="middle">1</text></svg></button>
    </div>
    <div class="seek-row">
      <span id="curTime">0:00</span>
      <input type="range" id="seekBar" min="0" max="100" value="0" aria-label="Position in the song">
      <span id="durTime">0:00</span>
    </div>
    <div class="volume-row">
      <span aria-hidden="true">🔉</span>
      <input type="range" id="volume" min="0" max="100" value="80" aria-label="Volume">
    </div>
  </div>

  <!-- Pages: each one lives in its own file under js/pages/ -->
  <nav class="tabs" id="pageTabs" role="tablist" aria-label="Pages"></nav>
  <main id="pages"></main>
</div>

<audio id="audio" preload="metadata" style="display:none"></audio>

<!-- namespace + pages (must come before state.js, which looks page elements up by id) -->
<script src="js/core/app.js"></script>
<script src="js/core/icons.js"></script>
<script src="js/pages/page-music.js"></script>
<script src="js/pages/page-games.js"></script>
<script src="js/pages/page-settings.js"></script>
<script src="js/pages/page-guide.js"></script>
<script src="js/pages/pages-mount.js"></script>

<!-- core -->
<script src="js/core/state.js"></script>
<script src="js/core/utils.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/themes.js"></script>
<script src="js/core/analysis.js"></script>
<script src="js/core/audio-engine.js"></script>
<script src="js/core/fx.js"></script>
<script src="js/core/canvas-core.js"></script>
<script src="js/core/mode-registry.js"></script>
<script src="js/core/taps.js"></script>
<script src="js/core/install.js"></script>

<!-- visualiser modes -->
<script src="js/modes/mode-basic.js"></script>
<script src="js/modes/mode-strings.js"></script>
<script src="js/modes/mode-emoji.js"></script>
<script src="js/modes/mode-rain.js"></script>
<script src="js/modes/mode-fire.js"></script>
<script src="js/modes/mode-ice.js"></script>
<script src="js/modes/mode-aqua.js"></script>
<script src="js/modes/mode-nature.js"></script>
<script src="js/modes/mode-piano.js"></script>
<script src="js/modes/mode-clock.js"></script>
<script src="js/modes/mode-liquid.js"></script>

<!-- mini-games -->
<script src="js/games/games-shared.js"></script>
<script src="js/games/game-tower-defense.js"></script>
<script src="js/games/game-survivor.js"></script>
<script src="js/games/game-cards.js"></script>
<script src="js/games/games-host.js"></script>

<!-- tools -->
<script src="js/tools/tool-sandbox.js"></script>

<!-- player -->
<script src="js/player/playlist.js"></script>
<script src="js/player/library.js"></script>
<script src="js/player/transport.js"></script>
<script src="js/player/background.js"></script>

<!-- boot: must be last -->
<script src="js/main.js"></script>
</body>
</html>
