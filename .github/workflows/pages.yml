# Runs the two checks that need no songs on every push to main.
# (engine/songtest.js needs test-songs/, which is never published, so it only runs locally.)
#
# The site itself is published by GitHub Pages straight from the main branch
# (repository Settings > Pages > Source: "Deploy from a branch", main, / root),
# so this workflow does not deploy: two deployers would race each other.
name: Checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine self-test
        run: node engine/test.js
      - name: Project check
        run: node engine/check.js
