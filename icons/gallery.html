<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icon options</title>
<style>
  body{ margin:0; padding:24px 16px 40px; background:#14111c; color:#eee9f7; font-family:"Segoe UI",system-ui,sans-serif; }
  h1{ font-size:1.2rem; text-align:center; margin:0 0 4px; }
  p.lead{ text-align:center; color:#a9a2bd; font-size:.85rem; margin:0 0 22px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:18px; max-width:1180px; margin:0 auto; }
  figure{ margin:0; background:#1d1929; border:1px solid #2f2942; border-radius:16px; padding:14px; }
  img.big{ width:100%; height:auto; display:block; }
  figcaption{ margin-top:10px; font-size:.78rem; line-height:1.45; color:#a9a2bd; }
  figcaption b{ display:block; color:#eee9f7; font-size:.9rem; margin-bottom:2px; }
  figcaption span{ display:block; }
  .small{ margin-top:8px; display:flex !important; align-items:center; gap:8px; font-size:.68rem; }
</style></head><body>
<h1>Music Visualiser Omega: icon options</h1>
<p class="lead">Each one is shown large and at the sizes a browser tab and a phone home screen use.</p>
<div class="grid">
  <figure>
    <img class="big" src="options/icon-01.svg" alt="">
    <figcaption><b>1. Neon Omega</b><span>Closest to your example: glowing Ω above a layered wave.</span>
      <span class="small"><img src="options/icon-01.svg" width="64" height="64" alt=""><img src="options/icon-01.svg" width="32" height="32" alt=""><img src="options/icon-01.svg" width="16" height="16" alt=""> 64 · 32 · 16 px</span>
    </figcaption>
  </figure>
  <figure>
    <img class="big" src="options/icon-02.svg" alt="">
    <figcaption><b>2. Wave Feet</b><span>The Ω stands on the sound wave: its feet become the wave.</span>
      <span class="small"><img src="options/icon-02.svg" width="64" height="64" alt=""><img src="options/icon-02.svg" width="32" height="32" alt=""><img src="options/icon-02.svg" width="16" height="16" alt=""> 64 · 32 · 16 px</span>
    </figcaption>
  </figure>
  <figure>
    <img class="big" src="options/icon-03.svg" alt="">
    <figcaption><b>3. Bold Mark</b><span>Simple and loud: solid Ω in front of a wide wave. Reads well very small.</span>
      <span class="small"><img src="options/icon-03.svg" width="64" height="64" alt=""><img src="options/icon-03.svg" width="32" height="32" alt=""><img src="options/icon-03.svg" width="16" height="16" alt=""> 64 · 32 · 16 px</span>
    </figcaption>
  </figure>
  <figure>
    <img class="big" src="options/icon-04.svg" alt="">
    <figcaption><b>4. Event Horizon</b><span>Black-hole look for "Decensus Ad Nihilum": a bright ring of bars around a dark centre.</span>
      <span class="small"><img src="options/icon-04.svg" width="64" height="64" alt=""><img src="options/icon-04.svg" width="32" height="32" alt=""><img src="options/icon-04.svg" width="16" height="16" alt=""> 64 · 32 · 16 px</span>
    </figcaption>
  </figure>
  <figure>
    <img class="big" src="options/icon-05.svg" alt="">
    <figcaption><b>5. Bar Omega</b><span>The Ω itself is drawn with equaliser bars.</span>
      <span class="small"><img src="options/icon-05.svg" width="64" height="64" alt=""><img src="options/icon-05.svg" width="32" height="32" alt=""><img src="options/icon-05.svg" width="16" height="16" alt=""> 64 · 32 · 16 px</span>
    </figcaption>
  </figure>
  <figure>
    <img class="big" src="options/icon-06.svg" alt="">
    <figcaption><b>6. Ascensus</b><span>Light version for "Ascensus ad Incertum": white tile, rainbow wave, dark Ω.</span>
      <span class="small"><img src="options/icon-06.svg" width="64" height="64" alt=""><img src="options/icon-06.svg" width="32" height="32" alt=""><img src="options/icon-06.svg" width="16" height="16" alt=""> 64 · 32 · 16 px</span>
    </figcaption>
  </figure>
  <figure>
    <img class="big" src="options/icon-07.svg" alt="">
    <figcaption><b>7. Synth Sun</b><span>Retro sunset: the wave is the horizon under a striped sun, Ω in the sun.</span>
      <span class="small"><img src="options/icon-07.svg" width="64" height="64" alt=""><img src="options/icon-07.svg" width="32" height="32" alt=""><img src="options/icon-07.svg" width="16" height="16" alt=""> 64 · 32 · 16 px</span>
    </figcaption>
  </figure>
  <figure>
    <img class="big" src="options/icon-08.svg" alt="">
    <figcaption><b>8. Monogram</b><span>One colour: a small wave inside a big Ω. Works as a stamp or a monochrome icon.</span>
      <span class="small"><img src="options/icon-08.svg" width="64" height="64" alt=""><img src="options/icon-08.svg" width="32" height="32" alt=""><img src="options/icon-08.svg" width="16" height="16" alt=""> 64 · 32 · 16 px</span>
    </figcaption>
  </figure>
  <figure>
    <img class="big" src="options/icon-09.svg" alt="">
    <figcaption><b>9. Halo</b><span>A circular visualiser ring around the Ω.</span>
      <span class="small"><img src="options/icon-09.svg" width="64" height="64" alt=""><img src="options/icon-09.svg" width="32" height="32" alt=""><img src="options/icon-09.svg" width="16" height="16" alt=""> 64 · 32 · 16 px</span>
    </figcaption>
  </figure>
  <figure>
    <img class="big" src="options/icon-10.svg" alt="">
    <figcaption><b>10. Dotted Spectrum</b><span>Dotted bars like the visualiser videos in test-songs, with a thin Ω.</span>
      <span class="small"><img src="options/icon-10.svg" width="64" height="64" alt=""><img src="options/icon-10.svg" width="32" height="32" alt=""><img src="options/icon-10.svg" width="16" height="16" alt=""> 64 · 32 · 16 px</span>
    </figcaption>
  </figure></div>
</body></html>
